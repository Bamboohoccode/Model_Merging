# alpha = 0.3. NuSLERP converts these weights to t = 0.3 / (0.7 + 0.3).
# No base_model is declared because this is direct SLERP between the two models.
models:
  - model: ComCom/gpt2-small
    parameters:
      weight: 0.7
  - model: /kaggle/working/inverse_model
    parameters:
      weight: 0.3

merge_method: nuslerp
parameters:
  nuslerp_flatten: true
  nuslerp_row_wise: false

dtype: float32
tokenizer:
  source: ComCom/gpt2-small
