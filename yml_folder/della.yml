# With one task vector, lambda = alpha = 0.3.
# density +/- epsilon must remain strictly inside (0, 1).
models:
  - model: /kaggle/working/inverse_model
    parameters:
      weight: 1.0
      density: 0.5
      epsilon: 0.1

base_model: ComCom/gpt2-small
merge_method: della
parameters:
  lambda: 0.3
  normalize: true
  rescale: true
  int8_mask: true

dtype: float32
tokenizer:
  source: base
